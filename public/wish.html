<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>断网杯 · 许愿池</title>
<style>
  :root{--ink:#0a0a0a;--paper:#f2eee3;--yellow:#ffd23f;--pink:#ff3fa4;--cyan:#27d3ee;--lime:#a8e63a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:#070707;color:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  body{padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% -10%,#1d1d1d,#070707 60%)}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:40px;font-weight:900;letter-spacing:2px;line-height:1.05;color:var(--yellow);
    text-shadow:4px 4px 0 var(--pink)}
  .sub{font-size:11px;letter-spacing:4px;color:#777;margin-top:6px}
  .status{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:12px;color:#bbb;
    background:#111;border:2px solid #2a2a2a;padding:8px 12px}
  .status b{color:var(--yellow)}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 8px}
  .dot.on{background:var(--lime);box-shadow:0 0 10px var(--lime)}
  .card{margin-top:14px;background:#101010;border:3px solid #242424;padding:14px}
  .label{font-size:10px;letter-spacing:3px;color:#777;font-weight:900;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#1b1b1b;border:2px solid #333;color:#ddd;padding:8px 12px;font-size:13px;
    font-weight:700;cursor:pointer;font-family:inherit}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--yellow);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--pink)}
  .chip.act{background:rgba(255,63,164,.12);border-color:#4a2038;color:#ffc7e3}
  .chip.act:active{background:var(--pink);color:#fff}
  #name{width:100%;font-family:inherit;font-size:18px;font-weight:900;padding:12px;
    background:var(--paper);color:var(--ink);border:3px solid var(--ink);outline:none}
  #text{width:100%;font-family:inherit;font-size:18px;font-weight:800;padding:12px;
    background:var(--paper);color:var(--ink);border:3px solid var(--ink);outline:none;margin-top:10px}
  #send{width:100%;margin-top:10px;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);
    box-shadow:6px 6px 0 var(--pink);font-family:inherit;font-size:22px;font-weight:900;letter-spacing:4px;
    padding:14px;cursor:pointer}
  #send:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--pink)}
  #send:disabled{background:#2a2a2a;color:#777;border-color:#333;box-shadow:none;transform:none}
  #msg{margin-top:12px;min-height:24px;font-size:14px;font-weight:800;line-height:1.5;color:var(--cyan)}
  #msg.bad{color:#ff8080}
  #msg.good{color:var(--lime)}
  .recent{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .w{background:#0d0d0d;border-left:4px solid var(--pink);padding:8px 10px}
  .w .t{font-size:13px;font-weight:800;line-height:1.4}
  .w .t b{color:var(--yellow)}
  .w .r{font-size:11px;color:#8f8f8f;margin-top:3px;line-height:1.4}
  .tips{margin-top:16px;font-size:11px;line-height:1.7;color:#666;border-top:1px dashed #2a2a2a;padding-top:10px}
  .tips b{color:#bbb}
</style>
</head>
<body>
<div class="wrap">
  <h1>许愿池</h1>
  <div class="sub">断 网 杯 · 许 愿 式 编 程 现 场 版</div>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>

  <div class="card">
    <div class="label">你是谁（随便写）</div>
    <input id="name" maxlength="10" placeholder="匿名观众" autocomplete="off">
  </div>

  <div class="card">
    <div class="label">先选人</div>
    <div class="chips" id="targets"></div>
  </div>

  <div class="card">
    <div class="label">再选愿望（点一下立刻生效）</div>
    <div class="chips" id="actions"></div>
    <input id="text" maxlength="60" placeholder="也可以直接写一句愿望" autocomplete="off">
    <button id="send">许 愿</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div class="label">刚刚实现的愿望</div>
    <div class="recent" id="recent"><div class="w"><div class="t" style="color:#666">还没有人许愿。</div></div></div>
  </div>

  <div class="tips">
    <b>不用联网。</b>许愿池跑在同一台笔记本上，规则解析是本地手写的，断网也能用。<br>
    <b>愿望会立刻生效。</b>仙人掌、金币雨、按钮失灵、加速减速、回血、打王……说不存在的愿望，解说会假装听懂了。
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
let pid = params.get('pid') || '';
let ST = null;
let target = { kind: 'random', name: '' };
let coolUntil = 0;
let busy = false;

const ACTIONS = [
  { label: '🌵 仙人掌', text: '前面来一根仙人掌' },
  { label: '❄️ 按钮失灵', text: '按钮失灵' },
  { label: '💸 金币雨', text: '下金币雨' },
  { label: '❤️ 回血', text: '回血' },
  { label: '⚡ 加速', text: '加速' },
  { label: '🐌 减速', text: '减速' },
  { label: '🚀 上天', text: '上天' },
  { label: '👑 王掉 20 血', text: '掉20血' },
  { label: '🎁 道具雨', text: '下道具雨' },
  { label: '💥 傻瓜弹', text: '傻瓜弹' },
  { label: '🌊 海水过滤器', text: '海水过滤器' },
  { label: '🚗 特斯拉', text: '特斯拉' },
];

const saved = localStorage.getItem('cup_wish_name') || '';
$('#name').value = saved;
$('#name').addEventListener('input', () => localStorage.setItem('cup_wish_name', $('#name').value));

function targetPrefix() {
  if (target.kind === 'all') return '全场';
  if (target.kind === 'self') return '给我';
  if (target.kind === 'player' && target.name) return '让' + target.name;
  return '给他';
}

function compose(actionText) {
  const p = targetPrefix();
  if (target.kind === 'all') return '全场' + actionText;
  if (target.kind === 'self') return '给我' + actionText;
  if (target.kind === 'player') return '让' + target.name + actionText;
  return actionText;  // 随机：交给服务端挑
}

function renderTargets() {
  const alive = (ST && ST.players ? ST.players : []).filter(p => p.inRound && !p.dead && !p.finished);
  const opts = [{ kind: 'random', label: '🎲 随机' }];
  if (pid) opts.push({ kind: 'self', label: '🙋 我' });
  opts.push({ kind: 'all', label: '🌍 全场' });
  for (const p of alive.slice(0, 5)) opts.push({ kind: 'player', name: p.name, label: p.name, color: p.color });
  $('#targets').innerHTML = opts.map(o => {
    const on = o.kind === target.kind && (o.kind !== 'player' || o.name === target.name);
    return `<button class="chip ${on ? 'on' : ''}" data-kind="${o.kind}" data-name="${o.name || ''}"
      ${o.color ? `style="border-color:${o.color}"` : ''}>${o.label}</button>`;
  }).join('');
  $('#targets').querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      target = { kind: b.dataset.kind, name: b.dataset.name };
      renderTargets();
    };
  });
}

function renderActions() {
  $('#actions').innerHTML = ACTIONS.map((a, i) =>
    `<button class="chip act" data-i="${i}">${a.label}</button>`).join('');
  $('#actions').querySelectorAll('.chip').forEach(b => {
    b.onclick = () => send(compose(ACTIONS[+b.dataset.i].text));
  });
}

function renderRecent() {
  const ws = (ST && ST.wishes) || [];
  if (!ws.length) {
    $('#recent').innerHTML = '<div class="w"><div class="t" style="color:#666">还没有人许愿。</div></div>';
    return;
  }
  $('#recent').innerHTML = ws.slice(0, 6).map(w => `
    <div class="w">
      <div class="t"><b>${esc(w.by)}</b>：${esc(w.text)}</div>
      <div class="r">${esc(w.reply)}</div>
    </div>`).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function setStatus() {
  const on = !!ST && (ST.phase === 'playing' || ST.phase === 'boss');
  $('#dot').classList.toggle('on', on);
  const label = { lobby: '等待开赛', countdown: '即将开赛', playing: '比赛进行中', boss: 'BOSS 战', car: '载具过场', crash: '撞击', result: '本局结束' }[ST && ST.phase] || '连接中';
  $('#statusText').innerHTML = ST ? `<b>${esc(label)}</b> · ${esc(ST.code || '')} · 已许愿 ${ST.wishCount || 0} 次` : '连接中…';
}

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    ST = await r.json();
    setStatus();
    renderTargets();
    renderRecent();
  } catch { /* 断网就等下一次 */ }
}

async function send(text) {
  if (busy) return;
  if (Date.now() < coolUntil) return;
  if (!ST || (ST.phase !== 'playing' && ST.phase !== 'boss')) {
    msg('比赛开始后才能许愿。', 'bad');
    return;
  }
  const t = String(text || '').trim();
  if (!t) { msg('先写一句愿望。', 'bad'); return; }
  busy = true;
  msg('许愿中…', '');
  try {
    const r = await fetch('/api/wish', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: t, name: $('#name').value.trim() || '匿名观众', pid: pid || undefined }),
    });
    const d = await r.json();
    if (d.ok) {
      msg('✓ ' + d.reply, 'good');
      coolUntil = Date.now() + (d.cooldown || 5000);
      $('#text').value = '';
      poll();
    } else {
      msg('✗ ' + (d.error || '许愿失败'), 'bad');
    }
  } catch {
    msg('✗ 连不上许愿池。检查 Wi-Fi。', 'bad');
  }
  busy = false;
}

function msg(t, cls) {
  const el = $('#msg');
  el.textContent = t;
  el.className = cls || '';
}

$('#send').onclick = () => {
  const t = $('#text').value.trim();
  if (t) send(t);
  else send(compose('下金币雨'));
};
$('#text').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('#send').click(); }
});

renderActions();
poll();
setInterval(poll, 1500);
setInterval(() => {
  const left = Math.max(0, coolUntil - Date.now());
  const b = $('#send');
  if (left > 0) { b.disabled = true; b.textContent = `冷 却 ${Math.ceil(left / 1000)}s`; }
  else { b.disabled = false; b.textContent = '许 愿'; }
}, 200);
</script>
</body>
</html>
