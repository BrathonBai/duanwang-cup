name = "duanwang"
main = "src/index.js"
compatibility_date = "2025-10-25"
workers_dev = true

routes = [
  { pattern = "duanwang.fiddling.work/*", zone_name = "fiddling.work" }
]

[assets]
directory = "../public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
